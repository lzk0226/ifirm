# Ifirm 工具链锁定（REQ-IMPL-001）
# 记录日期：2026-11-16（首次闭环）
# 宿主：Ubuntu 24.04.5 LTS，内核 6.8.0-149-generic，x86_64，4 vCPU / 3.8 GiB，无 KVM（TCG）

clang                        18.1.3 (Ubuntu 1ubuntu1)
ld.lld                       18.1.3
qemu-system-riscv64          8.2.2 (Debian 1:8.2.2+ds-0ubuntu1.18)
gdb-multiarch                15.1
riscv64-linux-gnu-gcc        13.3.0
riscv64-linux-gnu-binutils   2.42
OpenSBI                      v1.3（QEMU -bios default 内建）

# 固定编译参数（Makefile 为准）
CFLAGS  --target=riscv64-unknown-elf -std=c11 -ffreestanding -nostdlib -fno-builtin
        -march=rv64gc -mabi=lp64 -mcmodel=medany -fno-pic -mno-relax
        -O2 -g -Wall -Wextra -Werror
LDFLAGS -fuse-ld=lld -T linker/kernel.ld -Wl,--gc-sections -Wl,--no-relax

# 固定运行参数
QEMU    -machine virt -m 256M -smp 1 -nographic -bios default -kernel build/ifirm.bin

# 与规范 32.6 的差异（有意为之，需在变更记录中说明）
# 1. 增加 -mno-relax / -Wl,--no-relax：不设置 gp，禁止 linker 把 la 松弛成 gp 相对寻址
# 2. 增加 -fuse-ld=lld：--target=riscv64-unknown-elf 下 clang 默认找不到链接器
# 3. objcopy 用 riscv64-linux-gnu-objcopy：本机未安装 llvm-objcopy
